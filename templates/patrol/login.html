{% extends "patrol/base.html" %}
{% block title %}Password required · Patrol Board{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:60px auto;text-align:center">
  <h2>Password required</h2>
  <p class="muted">Enter the admin password to continue.</p>
  <form method="post" action="{{ url_for('.login') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="password" placeholder="Password" autofocus
           style="width:100%;padding:12px 14px;font-size:1.1rem;border:1px solid var(--line);border-radius:10px;margin:8px 0">
    <button class="btn primary" type="submit" style="width:100%">Unlock</button>
  </form>
</div>
{% endblock %}
