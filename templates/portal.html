<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrismXE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0f172a; color: #e2e8f0; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center;
         padding: 48px 16px; }
  h1 { font-size: 2rem; letter-spacing: 2px; margin-bottom: 8px; }
  p.sub { color: #94a3b8; margin-bottom: 40px; }
  .cards { display: grid; gap: 20px; width: 100%; max-width: 560px; }
  a.card { display: flex; align-items: center; gap: 18px;
           background: #1e293b; border: 1px solid #334155;
           border-radius: 16px; padding: 24px; text-decoration: none;
           color: inherit; transition: transform .12s, border-color .12s; }
  a.card:hover { transform: translateY(-2px); border-color: #3b82f6; }
  .icon { font-size: 2.4rem; }
  .card b { font-size: 1.2rem; display: block; margin-bottom: 4px; }
  .card span { color: #94a3b8; font-size: .95rem; }
</style>
</head>
<body>
  <h1>PrismXE</h1>
  <p class="sub">Field operations portal</p>
  <div class="cards">
    <a class="card" href="/gauge/">
      <div class="icon">🔧</div>
      <div><b>Boiler Gauge Check</b>
      <span>Photograph gauges, auto-read needles, log measurements</span></div>
    </a>
    <a class="card" href="/cm/">
      <div class="icon">🏗️</div>
      <div><b>Construction Manager</b>
      <span>Sites, workers, timecards, incidents, QA/QC</span></div>
    </a>
    <a class="card" href="/patrol/">
      <div class="icon">📋</div>
      <div><b>Patrol Board</b>
      <span>Equipment patrol timetable &amp; shift monitoring</span></div>
    </a>
  </div>
</body>
</html>
