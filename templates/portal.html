<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrismXE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0a0a0b; color: #f2f3f5; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center;
         padding: 48px 16px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
  p.sub { color: #a1a5ad; margin-bottom: 32px; font-size: .9rem; }
  .folders { display: grid; gap: 12px; width: 100%; max-width: 560px; }
  .folder { background: #131316; border: 1px solid rgba(255,255,255,.09);
            border-radius: 8px; overflow: hidden; }
  .folder-header { display: flex; align-items: center; gap: 12px;
                   padding: 16px 20px; cursor: pointer; user-select: none;
                   width: 100%; background: none; border: none;
                   color: inherit; font: inherit; text-align: left; }
  .folder-header:hover { background: #1a1a1e; }
  .folder-header b { font-size: 1rem; font-weight: 600; flex: 1; }
  .folder-header .count { color: #a1a5ad; font-size: .8rem;
                         background: #0a0a0b; border: 1px solid rgba(255,255,255,.09);
                         padding: 4px 8px; border-radius: 4px; }
  .folder-header .arrow { color: #4ade80; font-size: 1.1rem; line-height: 1;
                         transition: transform .2s; }
  .folder.open .folder-header .arrow { transform: rotate(90deg); }
  .folder-apps { display: none; padding: 0 8px 8px; }
  .folder.open .folder-apps { display: grid; gap: 8px; }
  .card { display: flex; align-items: center; gap: 12px;
           background: #0a0a0b; border: 1px solid rgba(255,255,255,.09);
           border-radius: 8px; padding: 12px 16px; text-decoration: none;
           color: inherit; transition: border-color .12s; }
  a.card:hover { border-color: #4ade80; }
  .card b { font-size: .95rem; font-weight: 600; display: block; margin-bottom: 2px; }
  .card span { color: #a1a5ad; font-size: .85rem; }
  .manage-link { margin-top: 24px; color: #f2f3f5; font-size: .9rem;
                 text-decoration: none; background: #131316;
                 border: 1px solid rgba(255,255,255,.09); border-radius: 8px;
                 padding: 12px 24px; display: inline-block; }
  .manage-link:hover { border-color: #4ade80; }
</style>
</head>
<body>
  <h1>PrismXE</h1>
  <p class="sub">Field operations portal</p>
  <div class="folders">
    {% for co in companies %}
    <div class="folder{% if loop.first %} open{% endif %}">
      <button class="folder-header" onclick="this.parentElement.classList.toggle('open')">
        <b>{{ co.name }}</b>
        <span class="count">{{ co.apps|length }} app{{ 's' if co.apps|length != 1 }}</span>
        <span class="arrow">›</span>
      </button>
      <div class="folder-apps">
        {% for a in co.apps %}
        {% if a.url %}
        <a class="card" href="{{ a.url }}"{% if a.download %} download{% endif %}>
          <div><b>{{ a.name }}</b><span>{{ a.desc }}</span></div>
        </a>
        {% else %}
        <div class="card">
          <div><b>{{ a.name }}</b><span>{{ a.desc }}</span></div>
        </div>
        {% endif %}
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
  <a class="manage-link" href="/manage">Manage folders</a>
</body>
</html>
