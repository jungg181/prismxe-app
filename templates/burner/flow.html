<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{{ flow_name }} — Burner Guide</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    margin: 0; background: #141518; color: #f2f3f5; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  header { background: #1e2026; border-bottom: 1px solid rgba(255,255,255,.08); color: #f2f3f5; padding: 12px; flex-shrink: 0; }
  header .row { display: flex; align-items: center; gap: 8px; max-width: 640px; margin: 0 auto; }
  header a.home { color: #f2f3f5; text-decoration: none; font-size: 22px; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 span { font-size: 12px; font-weight: 500; color: #a1a5ad; }
  header .cnt { font-size: 13px; font-weight: 500; color: #a1a5ad; white-space: nowrap; }
  .pbar { height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; margin-top: 8px; max-width: 640px; margin-left: auto; margin-right: auto; }
  .pbar > div { height: 100%; background: #e5a83b; border-radius: 2px; transition: width .3s; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; width: 100%; flex: 1; min-height: 0; }
  .dots { display: flex; gap: 4px; flex-wrap: nowrap; justify-content: center; margin: 0 0 8px; }
  .dots button {
    width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.2);
    background: transparent; color: #6b7078; font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; flex-shrink: 0;
  }
  .dots button.cur { border-color: #e5a83b; color: #e5a83b; }
  .dots button.done { background: #e5a83b; border-color: #e5a83b; color: #141518; }
  .dots button:disabled { cursor: default; opacity: .6; }
  .card { background: #1e2026; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .stepnum {
    display: inline-block; background: #e5a83b; color: #141518; font-weight: 600;
    font-size: 12px; border-radius: 999px; padding: 4px 12px; margin-bottom: 8px;
  }
  .card h2 { margin: 0 0 2px; font-size: 20px; font-weight: 600; line-height: 1.25; }
  .card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: #a1a5ad; line-height: 1.3; }
  .card p.en { font-size: 15px; line-height: 1.45; margin: 0 0 6px; }
  .card p.ko { font-size: 14px; line-height: 1.5; margin: 0; color: #a1a5ad; }
  .stepimg { background: #1e2026; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 8px; margin-bottom: 12px; }
  .stepimg img { width: 100%; max-height: 18vh; object-fit: cover; border-radius: 8px; display: block; }
  .stepimg .cap { font-size: 12px; font-weight: 600; color: #e5a83b; margin: 8px 4px 2px; line-height: 1.4; }
  .stepimg .capko { font-size: 11px; color: #6b7078; margin: 0 4px 2px; line-height: 1.4; }
  .timerbox {
    background: #0b0c0e; color: #f2f3f5; border-radius: 12px; padding: 12px;
    text-align: center; margin-bottom: 12px;
  }
  .timerbox .tdisp { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 2px; line-height: 1.1; }
  .timerbox .tbtns { display: flex; gap: 8px; margin-top: 10px; }
  .timerbox .tbtns button {
    flex: 1; padding: 12px; font-size: 15px; font-weight: 600; border: none;
    border-radius: 10px; cursor: pointer;
  }
  .tstart { background: #2f9e44; color: #fff; }
  .tpause { background: #e5a83b; color: #141518; }
  .treset { background: #3a3d44; color: #f2f3f5; }
  .timenote { font-size: 12px; color: #6b7078; margin-top: 8px; line-height: 1.4; }
  .skiptimer { display: block; text-align: center; margin-top: 8px; color: #6b7078; font-size: 13px; background: none; border: none; cursor: pointer; width: 100%; }
  .nav { display: flex; gap: 8px; }
  .nav button {
    flex: 1; padding: 12px; font-size: 17px; font-weight: 600; border: none;
    border-radius: 12px; cursor: pointer;
  }
  .back { background: #26282e; color: #f2f3f5; }
  .next { background: #e5a83b; color: #141518; }
  .finish { background: #2f9e44; color: #fff; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .donescreen { text-align: center; padding: 40px 20px; }
  .donescreen h2 { font-size: 26px; margin: 12px 0 6px; }
  .donescreen p { color: #a1a5ad; font-size: 16px; }
  .donescreen a {
    display: inline-block; margin-top: 20px; background: #e5a83b; color: #141518;
    text-decoration: none; font-weight: 600; font-size: 18px; padding: 16px 40px; border-radius: 12px;
  }
  /* Very short phones: tighten further so one step still fits without scrolling */
  @media (max-height: 700px) {
    .card { padding: 12px; }
    .card h2 { font-size: 18px; }
    .card p.en { font-size: 14px; }
    .card p.ko { font-size: 13px; }
    .stepimg img { max-height: 13vh; }
    .timerbox .tdisp { font-size: 36px; }
    .nav button { padding: 10px; }
  }
  #alarm {
    display: none; position: fixed; inset: 0; z-index: 50; background: #b3261e;
    color: #fff; text-align: center; padding: 60px 24px;
  }
  #alarm h2 { font-size: 34px; margin: 16px 0 8px; font-weight: 600; }
  #alarm p.en { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  #alarm p.ko { font-size: 19px; margin: 0 0 30px; opacity: .95; }
  #alarm button {
    background: #fff; color: #b3261e; border: none; border-radius: 12px;
    font-size: 22px; font-weight: 600; padding: 20px 60px; cursor: pointer;
  }
  #alarm button.secondary {
    background: transparent; color: #fff; border: 2px solid #fff;
    font-size: 18px; padding: 14px 40px; margin-top: 12px;
  }
  #timerBadge {
    display: none; position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 40; background: #1e2026; color: #f2f3f5; border-radius: 999px;
    padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.35); white-space: nowrap; border: 2px solid #e5a83b;
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <a class="home" href="/burner/">‹</a>
    <h1>{{ flow_name }} <span>{{ flow_name_ko }}</span></h1>
    <div class="cnt" id="counter"></div>
  </div>
  <div class="pbar"><div id="pfill" style="width:0%"></div></div>
</header>
<main id="main"></main>

<div id="alarm">
  <h2>TIME'S UP</h2>
  <p class="en" id="alarmEn"></p>
  <p class="ko" id="alarmKo"></p>
  <button id="alarmOk">Continue / 계속</button><br>
  <button id="alarmGoto" class="secondary" style="display:none"></button><br>
  <button id="alarmDismiss" class="secondary" style="display:none">Dismiss / 닫기</button>
</div>

<div id="timerBadge" onclick="badgeGoto()"></div>

<script>
const STEPS = {{ steps_json | safe }};
const FLOW_ID = "{{ flow_id }}";
const N = STEPS.length;
let idx = 0;
let visited = 0;

// ---- timer persistence (localStorage) ----
function timerKey(i) { return 'burner_timer_' + FLOW_ID + '_' + (i === undefined ? idx : i); }
function saveTimerState() {
  try { localStorage.setItem(timerKey(), JSON.stringify({ end: Date.now() + tRemain * 1000, paused: false, remain: tRemain })); } catch (e) {}
}
function saveTimerPaused() {
  try { localStorage.setItem(timerKey(), JSON.stringify({ end: 0, paused: true, remain: tRemain })); } catch (e) {}
}
function clearTimerState(i) {
  try { localStorage.removeItem(timerKey(i)); } catch (e) {}
}
function loadTimerState(i) {
  try {
    const raw = localStorage.getItem(timerKey(i));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

// ---- timer state ----
const TIMER_SECONDS = 30 * 60;
let tRemain = TIMER_SECONDS, tId = null, tRunning = false;
let pendingTMode = 'fresh'; // set by render() for timer steps: fresh|paused|running|expired
let wakeLock = null;
let audioCtx = null, alarmOsc = null, alarmGain = null, alarmTimer = null, vibTimer = null;

const main = document.getElementById('main');
const counter = document.getElementById('counter');
const pfill = document.getElementById('pfill');

function fmt(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60), ss = s % 60;
  return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}

function render() {
  stopTimer(false);
  counter.textContent = 'Step ' + (idx + 1) + ' / ' + N;
  pfill.style.width = ((idx + 1) / N * 100) + '%';
  const st = STEPS[idx];

  let dots = '<div class="dots">';
  for (let i = 0; i < N; i++) {
    const cls = i === idx ? 'cur' : (i <= visited ? 'done' : '');
    const dis = i <= visited ? '' : 'disabled';
    dots += '<button class="' + cls + '" ' + dis + ' onclick="goto(' + i + ')">' + (i + 1) + '</button>';
  }
  dots += '</div>';

  let html = dots +
    '<div class="card"><span class="stepnum">STEP ' + (idx + 1) + '</span>' +
    '<h2>' + esc(st.title_en) + '</h2><h3>' + esc(st.title_ko) + '</h3>' +
    '<p class="en">' + esc(st.body_en) + '</p><p class="ko">' + esc(st.body_ko) + '</p></div>';

  if (st.image) {
    html += '<div class="stepimg"><img src="' + esc(st.image) + '" alt="control panel" loading="lazy">' +
      '<div class="cap">' + esc(st.image_en || '') + '</div>' +
      '<div class="capko">' + esc(st.image_ko || '') + '</div></div>';
  }

  if (st.kind === 'timer') {
    // Check for a persisted timer (survives back/forward navigation & reloads)
    const saved = loadTimerState();
    let tMode = 'fresh'; // fresh | paused | running | expired
    if (saved) {
      if (saved.paused && saved.remain > 0) {
        tRemain = saved.remain;
        tMode = 'paused';
      } else if (!saved.paused && saved.end > Date.now()) {
        tRemain = Math.ceil((saved.end - Date.now()) / 1000);
        tMode = 'running';
      } else if (!saved.paused && saved.end > 0) {
        tRemain = 0;
        tMode = 'expired';
      } else {
        tRemain = st.minutes * 60;
      }
    } else {
      tRemain = st.minutes * 60;
    }
    const startLabel = tMode === 'paused'
      ? 'Resume ' + fmt(tRemain)
      : 'Start ' + st.minutes + ':00 Timer';
    html += '<div class="timerbox"><div class="tdisp" id="tdisp">' + fmt(tRemain) + '</div>' +
      '<div class="tbtns">' +
      '<button class="tstart" id="tStart" onclick="timerStart()">' + esc(startLabel) + '</button>' +
      '<button class="tpause" id="tPause" onclick="timerPause()" style="display:none">Pause</button>' +
      '<button class="treset" onclick="timerReset()">Reset</button>' +
      '</div>' +
      '<div class="timenote">Keep this page open during the wait — the alarm needs the page open.<br>대기 중에는 이 페이지를 열어 두세요.</div></div>' +
      '<button class="skiptimer" onclick="skipTimer()">Skip timer →</button>';
    // stash the resume mode for after innerHTML is set
    pendingTMode = tMode;
  }

  const isLast = idx === N - 1;
  html += '<div class="nav" style="margin-top:14px">' +
    '<button class="back" onclick="back()"' + (idx === 0 ? ' disabled' : '') + '>‹ Back<br><span style="font-size:12px">이전</span></button>';
  if (st.kind === 'timer') {
    html += '<button class="next" onclick="next()">Next →<br><span style="font-size:12px">다음 미리 보기</span></button>';
  } else if (isLast) {
    html += '<button class="finish" onclick="finish()">Done<br><span style="font-size:12px">완료</span></button>';
  } else {
    html += '<button class="next" onclick="next()">Next →<br><span style="font-size:12px">다음</span></button>';
  }
  html += '</div>';
  main.innerHTML = html;
  // Resume a persisted timer after navigation/reload
  if (STEPS[idx].kind === 'timer') {
    if (pendingTMode === 'running') {
      timerStart(); // resumes countdown from remaining time, re-saves end-time
    } else if (pendingTMode === 'expired') {
      timerDone(); // end-time already passed — ring the alarm immediately
    }
    // 'paused' and 'fresh' need no action: UI already shows correct state
  }
  pendingTMode = 'fresh';
  window.scrollTo(0, 0);
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function goto(i) { if (i <= visited) { idx = i; render(); } }
function back() { if (idx > 0) { idx--; render(); } }
function next() {
  stopTimer(false);
  if (idx < N - 1) { idx++; visited = Math.max(visited, idx); render(); }
}
function finish() {
  main.innerHTML = '<div class="card donescreen">' +
    '<h2>Procedure Complete</h2><h3 style="color:#a1a5ad">절차 완료</h3>' +
    '<p>{{ flow_name }} finished.</p>' +
    '<a href="/burner/">Back to Home / 처음으로</a></div>';
  counter.textContent = 'Done';
  pfill.style.width = '100%';
  window.scrollTo(0, 0);
}

// ---- timer ----
async function lockScreen() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* not supported — fine */ }
}
function unlockScreen() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}

function timerStart() {
  if (tRunning || tRemain <= 0) return;
  tRunning = true;
  saveTimerState(); // persist end-time so back/forward navigation resumes
  lockScreen();
  document.getElementById('tStart').style.display = 'none';
  document.getElementById('tPause').style.display = '';
  tId = setInterval(() => {
    tRemain--;
    const d = document.getElementById('tdisp');
    if (d) d.textContent = fmt(tRemain);
    if (tRemain <= 0) timerDone();
  }, 1000);
}
function timerPause() {
  tRunning = false;
  clearInterval(tId); tId = null;
  saveTimerPaused(); // remember remaining time across navigation
  unlockScreen();
  document.getElementById('tStart').style.display = '';
  document.getElementById('tStart').textContent = 'Resume ' + fmt(tRemain);
  document.getElementById('tPause').style.display = 'none';
}
function timerReset() {
  stopTimer(true);
  clearTimerState(); // user cancelled — drop the persisted timer
  tRemain = STEPS[idx].minutes * 60;
  const d = document.getElementById('tdisp');
  if (d) d.textContent = fmt(tRemain);
  const s = document.getElementById('tStart');
  if (s) { s.style.display = ''; s.textContent = 'Start ' + STEPS[idx].minutes + ':00 Timer'; }
  const p = document.getElementById('tPause');
  if (p) p.style.display = 'none';
}
function skipTimer() {
  clearTimerState(); // user skipped — drop the persisted timer
  next();
}
function stopTimer(resetUI) {
  tRunning = false;
  if (tId) { clearInterval(tId); tId = null; }
  unlockScreen();
}

function timerDone() {
  stopTimer(false);
  clearTimerState(); // timer finished — drop the persisted timer
  resetAlarmButtons(); // show the normal Continue button
  const st = STEPS[idx];
  document.getElementById('alarmEn').textContent = st.done_en || "TIME'S UP";
  document.getElementById('alarmKo').textContent = st.done_ko || '';
  document.getElementById('alarm').style.display = 'block';
  startAlarm();
  if ('vibrate' in navigator) {
    navigator.vibrate([500, 250, 500, 250, 500]);
    vibTimer = setInterval(() => navigator.vibrate([500, 250, 500, 250, 500]), 3000);
  }
}

function startAlarm() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    alarmOsc = audioCtx.createOscillator();
    alarmGain = audioCtx.createGain();
    alarmOsc.connect(alarmGain);
    alarmGain.connect(audioCtx.destination);
    alarmOsc.frequency.value = 880;
    alarmOsc.type = 'square';
    let on = true;
    alarmGain.gain.value = 0.25;
    alarmOsc.start();
    alarmTimer = setInterval(() => {
      on = !on;
      alarmGain.gain.value = on ? 0.25 : 0.0;
    }, 500);
  } catch (e) { /* audio unavailable */ }
}
function stopAlarm() {
  if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
  if (vibTimer) { clearInterval(vibTimer); vibTimer = null; }
  try {
    if (alarmOsc) { alarmOsc.stop(); alarmOsc.disconnect(); alarmOsc = null; }
    if (alarmGain) { alarmGain.disconnect(); alarmGain = null; }
  } catch (e) {}
  if ('vibrate' in navigator) navigator.vibrate(0);
}

document.getElementById('alarmOk').addEventListener('click', () => {
  stopAlarm();
  document.getElementById('alarm').style.display = 'none';
  resetAlarmButtons();
  next(); // auto-advance after timer completes
});

function resetAlarmButtons() {
  document.getElementById('alarmOk').style.display = '';
  document.getElementById('alarmGoto').style.display = 'none';
  document.getElementById('alarmDismiss').style.display = 'none';
}

// ---- background timers: fire alarm even when user navigated to another step ----
let badgeStep = -1;

function showBackgroundAlarm(i) {
  const st = STEPS[i];
  document.getElementById('alarmEn').textContent = st.done_en || "TIME'S UP";
  document.getElementById('alarmKo').textContent = st.done_ko || '';
  document.getElementById('alarm').style.display = 'block';
  // Swap buttons: hide normal Continue, show Go-to-step + Dismiss
  document.getElementById('alarmOk').style.display = 'none';
  const bg = document.getElementById('alarmGoto');
  bg.style.display = '';
  bg.textContent = 'Go to Step ' + (i + 1) + ' / ' + (i + 1) + '단계로 이동';
  bg.onclick = () => {
    stopAlarm();
    document.getElementById('alarm').style.display = 'none';
    resetAlarmButtons();
    goto(i);
  };
  const dd = document.getElementById('alarmDismiss');
  dd.style.display = '';
  dd.onclick = () => {
    stopAlarm();
    document.getElementById('alarm').style.display = 'none';
    resetAlarmButtons();
  };
  startAlarm();
  if ('vibrate' in navigator) {
    navigator.vibrate([500, 250, 500, 250, 500]);
    vibTimer = setInterval(() => navigator.vibrate([500, 250, 500, 250, 500]), 3000);
  }
}

function updateTimerBadge() {
  const badge = document.getElementById('timerBadge');
  let best = null, bestIdx = -1;
  for (let i = 0; i < N; i++) {
    if (STEPS[i].kind !== 'timer' || i === idx) continue; // skip current step (timerbox shows it)
    const raw = loadTimerState(i);
    if (!raw || raw.paused || !(raw.end > Date.now())) continue;
    if (!best || raw.end < best.end) { best = raw; bestIdx = i; }
  }
  if (best) {
    badgeStep = bestIdx;
    const remain = Math.ceil((best.end - Date.now()) / 1000);
    badge.style.display = 'block';
    badge.textContent = '' + STEPS[bestIdx].title_en + ': ' + fmt(remain);
  } else {
    badge.style.display = 'none';
    badgeStep = -1;
  }
}
function badgeGoto() { if (badgeStep >= 0) goto(badgeStep); }

// Global monitor: every second, check for timers that finished while the
// user was on a different step, and refresh the floating badge.
setInterval(() => {
  const alarmVisible = document.getElementById('alarm').style.display === 'block';
  if (!alarmVisible) {
    for (let i = 0; i < N; i++) {
      if (STEPS[i].kind !== 'timer') continue;
      if (i === idx && tRunning) continue; // step's own interval handles it
      const raw = loadTimerState(i);
      if (!raw || raw.paused) continue;
      if (raw.end > 0 && raw.end <= Date.now()) {
        clearTimerState(i);
        showBackgroundAlarm(i);
        break; // one alarm at a time
      }
    }
  }
  updateTimerBadge();
}, 1000);

render();
</script>
</body>
</html>
