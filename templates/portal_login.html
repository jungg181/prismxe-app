<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrismXE · Password</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0f172a; color: #e2e8f0; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; padding: 24px 16px; }
  h1 { font-size: 2rem; letter-spacing: 2px; margin-bottom: 8px; }
  p.sub { color: #94a3b8; margin-bottom: 28px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 16px;
         padding: 28px 24px; width: 100%; max-width: 360px; }
  .box p { color: #94a3b8; margin-bottom: 14px; text-align: center; }
  .err { color: #f87171; margin-bottom: 12px; text-align: center; }
  input { width: 100%; padding: 12px 14px; font-size: 1.05rem; border-radius: 10px;
          border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
          margin-bottom: 12px; }
  button { width: 100%; padding: 12px; font-size: 1.05rem; font-weight: 700;
           border: none; border-radius: 10px; background: #3b82f6; color: #fff;
           cursor: pointer; }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
  <h1>PRISM<span style="color:#3b82f6">XE</span></h1>
  <p class="sub">Company apps portal</p>
  <form class="box" method="post" action="/">
    <p>Enter the password to open the portal.</p>
    {% if error %}<div class="err">Wrong password.</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus
           autocomplete="off">
    <button type="submit">Unlock</button>
  </form>
</body>
</html>
