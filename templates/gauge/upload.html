<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Upload Photos — Hanseong Check List</title>
<style>
  :root{
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --ink:#18181b; --ink-2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
    --bg:#f4f4f5; --card:#ffffff; --line:#e4e4e7; --line-soft:#f4f4f5;
    --input-bg:#ffffff; --hover-bg:#f4f4f5; --thead-bg:#fafafa;
    --brand:#16a34a; --brand-strong:#15803d; --brand-soft:#dcfce7;
    --brand-ring:rgba(22,163,74,.18);
    --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2;
    --orange:#ea580c; --orange-bg:#ffedd5;
    --amber:#d97706; --amber-bg:#fef3c7;
    --blue:#2563eb; --blue-bg:#dbeafe;
    --radius:8px;
  }
  [data-theme="dark"]{
    --ink:#e8e8ea; --ink-2:#b0b0b5; --muted:#8a8a90; --faint:#5c5c62;
    --bg:#0a0a0b; --card:#131316; --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.06);
    --input-bg:#1a1a1d; --hover-bg:#1e1e21; --thead-bg:#131316;
    --brand:#4ade80; --brand-strong:#86efac; --brand-soft:#0f1f14;
    --brand-ring:rgba(74,222,128,.28);
    --green:#4ade80; --green-bg:#0f1f14;
    --red:#f87171; --red-bg:#2a1214;
    --orange:#fb923c; --orange-bg:#2a1a0e;
    --amber:#fbbf24; --amber-bg:#2a2210;
    --blue:#60a5fa; --blue-bg:#101c2e;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .btn { display: block; width: 100%; padding: 14px; margin-top: 10px; font-size: 16px;
         border: 1px solid var(--brand); border-radius: var(--radius); background: var(--brand); color: #fff; cursor: pointer; font-weight: 600; }
  [data-theme="dark"] .btn { color: #0a0a0b; }
  .btn:disabled { opacity: .5; }
  .btn-sec { background: var(--card); color: var(--ink); border-color: var(--line); }
  .btn-edit { background: var(--card); color: var(--ink); border: 1px solid var(--line); width: auto; display: inline-block; padding: 8px 14px; font-size: 14px; }
  .pitem { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  #driveStatus { white-space: pre-line; margin-top: 10px; font-size: 13px; }
  .nav { display: flex; gap: 8px; margin-bottom: 12px; }
  .nav a { flex: 1; text-align: center; padding: 12px; background: var(--card); border: 1px solid var(--line);
           border-radius: var(--radius); text-decoration: none; color: var(--brand); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="/Hanseong/gauge/">Home</a>
    <a href="/Hanseong/gauge/inspect">Inspection</a>
  </div>
  <div class="card">
    <h2>Upload Photos</h2>
    <div class="muted">Photos saved on this phone. Upload sends them to Google Drive — no sign-in needed.</div>
    <div class="muted" style="margin-top:4px"><span id="pendingCount">0</span> photos pending</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" id="cameraBtn" style="flex:1">Camera</button>
      <button class="btn btn-sec" id="galleryBtn" style="flex:1">Choose Photos</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="galleryInput" accept="image/*" multiple style="display:none">
  </div>
  <div class="card">
    <div id="pendingList"></div>
    <button class="btn" id="driveUploadBtn">Upload all to Google Drive</button>
    <div id="driveStatus" class="muted"></div>
  </div>
</div>
<script>
let hcdb = null;
function hcDbOpen() {
  return new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open("hc_photos", 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("photos"))
          db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      };
      req.onsuccess = () => { hcdb = req.result; resolve(hcdb); };
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  });
}
function hcDbStore(mode) { return hcdb.transaction("photos", mode).objectStore("photos"); }
function hcDbAll() {
  return new Promise((resolve, reject) => {
    const r = hcDbStore("readonly").getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  });
}
function hcDbDelete(id) {
  return new Promise((resolve, reject) => {
    const r = hcDbStore("readwrite").delete(id);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(m) { alert(m); }
function driveStatus(m) { document.getElementById("driveStatus").textContent = m; }

async function renderPending() {
  const list = document.getElementById("pendingList");
  let recs = [];
  try { recs = await hcDbAll(); } catch (e) { list.innerHTML = "<div class='muted'>Phone storage unavailable.</div>"; return; }
  recs.sort((a, b) => (a.ts < b.ts ? 1 : -1));
  document.getElementById("pendingCount").textContent = recs.length;
  if (!recs.length) { list.innerHTML = "<p class='muted'>No pending photos.</p>"; return; }
  list.innerHTML = recs.map(r => `
    <div class="pitem">
      <img src="${URL.createObjectURL(r.blob)}" style="width:72px;height:72px;object-fit:cover;border-radius:6px">
      <div style="flex:1;font-size:12px;min-width:0">
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.filename)}</div>
        <div class="muted">${esc(r.gaugeName || "")} · ${esc((r.ts || "").replace("T", " ").slice(0, 19))}</div>
      </div>
      <button class="btn btn-edit" onclick="hcDeletePending(${r.id})">✕</button>
    </div>`).join("");
}
window.hcDeletePending = async (id) => {
  try { await hcDbDelete(id); } catch (e) { toast("Delete failed"); return; }
  renderPending();
};

document.getElementById("driveUploadBtn").onclick = async () => {
  let recs = [];
  try { recs = await hcDbAll(); } catch (e) { toast("Phone storage unavailable"); return; }
  if (!recs.length) { toast("No pending photos"); return; }
  const btn = document.getElementById("driveUploadBtn");
  btn.disabled = true;
  const failed = [];
  let done = 0;
  recs.sort((a, b) => (a.ts < b.ts ? -1 : 1));
  for (const rec of recs) {
    try {
      driveStatus("Uploading " + (done + 1) + "/" + recs.length + ": " + rec.filename);
      const fd = new FormData();
      fd.append("photo", rec.blob, rec.filename);
      fd.append("filename", rec.filename);
      const r = await fetch("/Hanseong/gauge/api/drive-upload", { method: "POST", body: fd });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || "upload failed");
      await hcDbDelete(rec.id);
      done++;
    } catch (e) {
      failed.push(rec.filename + " (" + e.message + ")");
    }
  }
  btn.disabled = false;
  if (failed.length) {
    driveStatus("Finished: " + done + " uploaded, " + failed.length + " failed (kept on phone):\n" + failed.join("\n"));
    toast("Some uploads failed — kept on phone");
  } else {
    driveStatus("All " + done + " photos uploaded to Google Drive. Phone copies deleted.");
    toast("All uploaded — phone cleared");
  }
  renderPending();
};

hcDbOpen().then(renderPending).catch(() => {
  document.getElementById("pendingList").innerHTML = "<div class='muted'>Phone storage unavailable.</div>";
});

// Camera / gallery pickers -> save into IndexedDB pending list
function hcDbAdd(blob, filename) {
  return new Promise((resolve, reject) => {
    const rec = { blob: blob, filename: filename, ts: new Date().toISOString(), gaugeName: "" };
    const r = hcDbStore("readwrite").add(rec);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
function handlePickedFiles(fileList) {
  if (!fileList || !fileList.length) return;
  (async () => {
    let added = 0;
    for (const f of fileList) {
      try {
        const ext = (f.name.split(".").pop() || "jpg").toLowerCase();
        const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15);
        await hcDbAdd(f, stamp + "." + ext);
        added++;
      } catch (e) { /* skip */ }
    }
    if (added) { renderPending(); toast(added + " photo(s) added — tap Upload to send to Drive"); }
  })();
}
document.getElementById("cameraBtn").onclick = () => document.getElementById("cameraInput").click();
document.getElementById("galleryBtn").onclick = () => document.getElementById("galleryInput").click();
document.getElementById("cameraInput").onchange = (e) => { handlePickedFiles(e.target.files); e.target.value = ""; };
document.getElementById("galleryInput").onchange = (e) => { handlePickedFiles(e.target.files); e.target.value = ""; };
</script>
</body>
</html>
