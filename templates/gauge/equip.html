<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hanseong Check List</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: #f5f5f5;
    color: #222;
    min-height: 100vh;
  }
  header {
    background: #1976d2;
    color: #fff;
    padding: 16px 20px;
    text-align: center;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card.done { border: 2px solid #2e7d32; }
  .gname { font-size: 17px; font-weight: 600; color: #222; }
  .gmeta { font-size: 13px; color: #666; margin: 4px 0 10px; }
  .btn {
    display: block; width: 100%;
    padding: 14px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 8px;
    margin-top: 8px; cursor: pointer;
  }
  .btn-cam { background: #1976d2; color: #fff; }
  .btn-ok { background: #2e7d32; color: #fff; }
  .btn-edit { background: #fff; color: #222; border: 1px solid #bbb; font-weight: normal; }
  .btn:disabled { opacity: 0.5; }
  .toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .toggle button {
    flex: 1; padding: 14px; font-size: 16px; font-weight: 600;
    border: 1px solid #bbb; border-radius: 8px;
    background: #fff; color: #222; cursor: pointer;
  }
  .toggle button.on { background: #1976d2; color: #fff; border-color: #1976d2; }
  .val { font-size: 32px; font-weight: 700; color: #222; margin: 8px 0; }
  .thumb { width: 100%; border-radius: 8px; margin-top: 8px; }
  .row { display: flex; gap: 8px; }
  .row .btn { margin-top: 8px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid #bbb; border-radius: 8px; margin-top: 8px;
    background: #fff; color: #222;
  }
  input::placeholder { color: #999; }
  .prog { text-align: center; font-size: 14px; color: #666; margin: 4px 0 12px; }
  .warn {
    background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px;
    padding: 10px; font-size: 13px; margin-top: 8px; color: #7a5c00;
  }
  .ok-badge { color: #2e7d32; font-weight: bold; }
  .cal-need { color: #e65100; }
  .muted { color: #666; }
  .muted-sm { color: #888; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff;
    padding: 12px 20px; border-radius: 8px; display: none;
    font-size: 15px; z-index: 50;
  }
  .equip-link {
    display: block; background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 16px; margin-bottom: 12px; text-decoration: none; color: #222;
  }
  .equip-link b { font-size: 17px; color: #222; }
  .equip-link span { display: block; font-size: 13px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Equipment</h1>
  <p id="subtitle"></p>
</header>
<main>
  <div class="card">
    <div class="muted" style="font-size:14px;margin-bottom:4px">Worker name</div>
    <input type="text" id="worker" placeholder="e.g. John" style="margin-top:0">
  </div>
  <div class="toggle">
    <button id="btnRun" class="on">Running</button>
    <button id="btnStop">Stopped</button>
  </div>
  <div class="prog" id="prog"></div>
  <div id="gauges"></div>
</main>
<div id="toast"></div>
<div id="camOverlay" style="display:none;position:fixed;inset:0;background:#000;z-index:100">
  <video id="camVideo" autoplay playsinline style="width:100%;height:calc(100% - 96px);object-fit:cover;background:#000"></video>
  <div style="display:flex;gap:8px;padding:16px">
    <button class="btn" style="background:#555;color:#fff;margin-top:0" onclick="closeCam()">Cancel</button>
    <button class="btn" style="background:#2e7d32;color:#fff;margin-top:0" onclick="capturePhoto()">📷 Capture</button>
  </div>
</div>

<script>
const EQUIP_ID = "{{ equip_id }}";
const GAUGE_PARAM = new URLSearchParams(location.search).get("gauge");
let gauges = [];
let state = "run";
let doneSet = new Set(JSON.parse(localStorage.getItem("done_" + EQUIP_ID + "_" + state) || "[]"));

worker.value = localStorage.getItem("worker") || "";
worker.onchange = () => localStorage.setItem("worker", worker.value);

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}

async function load() {
  const r = await fetch("/gauge/api/equipment/" + EQUIP_ID);
  const d = await r.json();
  document.getElementById("title").textContent = d.name;
  document.getElementById("subtitle").textContent = d.system + " · " + d.id;
  gauges = d.gauges;
  render();
  if (GAUGE_PARAM) {
    const card = document.getElementById("card-" + GAUGE_PARAM);
    if (card) {
      setTimeout(() => {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.style.outline = "3px solid #2e7d32";
        setTimeout(() => card.style.outline = "", 4000);
        // Auto-open camera for the QR-linked gauge
        const g = gauges.find(x => x.id === GAUGE_PARAM);
        if (g) openCam(GAUGE_PARAM, g);
      }, 300);
    }
  }
}

function visibleGauges() {
  if (GAUGE_PARAM) return gauges;  // deep link: show all gauges
  return gauges.filter(g => state === "run" ? g.check_running === "O" : g.check_stopped === "O");
}

function render() {
  const list = visibleGauges();
  const box = document.getElementById("gauges");
  const done = list.filter(g => doneSet.has(g.id)).length;
  document.getElementById("prog").textContent = list.length ? `${done} / ${list.length} done` : "No gauges to check in this state";
  box.innerHTML = "";
  list.forEach(g => {
    const card = document.createElement("div");
    card.className = "card" + (doneSet.has(g.id) ? " done" : "");
    card.id = "card-" + g.id;
    card.innerHTML = `
      <div class="gname">${doneSet.has(g.id) ? '<span class="ok-badge">✓</span> ' : ""}${esc(g.name)}</div>
      <div class="gmeta">${esc(g.item || "Item not registered")} ${g.unit ? "· " + esc(g.unit) : ""}${g.calibrated ? "" : ' · <span class="cal-need">Calibration needed</span>'}</div>
      <div class="res" style="display:none"></div>
      <input type="file" accept="image/*" style="display:none" id="file-${g.id}">
      <button class="btn btn-cam" onclick="shoot('${g.id}')">📷 Take photo</button>`;
    box.appendChild(card);
    card.querySelector("input").addEventListener("change", ev => onPhoto(g, ev.target.files[0]));
  });
  btnRun.classList.toggle("on", state === "run");
  btnStop.classList.toggle("on", state === "stop");
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function shoot(gid) {
  // In-page camera: small memory footprint, no heavy camera app.
  openCam(gid);
}

let camStream = null, camGid = null, camGauge = null;
async function openCam(gid, gaugeObj) {
  camGid = gid; camGauge = gaugeObj || null;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no camera api");
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
  } catch (e) {
    document.getElementById("file-" + gid).click();  // fallback: file picker
    return;
  }
  const v = document.getElementById("camVideo");
  v.srcObject = camStream;
  try { await v.play(); } catch (e) {}
  document.getElementById("camOverlay").style.display = "block";
}
function closeCam() {
  document.getElementById("camOverlay").style.display = "none";
  const v = document.getElementById("camVideo");
  if (v) v.srcObject = null;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}
async function capturePhoto() {
  const v = document.getElementById("camVideo");
  const w = v.videoWidth || 1280, h = v.videoHeight || 960;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(v, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  const gid = camGid, gobj = camGauge;
  closeCam();
  if (blob) onPhoto(gobj || gauges.find(x => x.id === gid), blob);
  else toast("Capture failed — try again");
}

// Shrink the photo to 1280px before upload (faster upload + reading)
async function shrinkPhoto(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    bmp.close();
    return blob || file;
  } catch (e) { return file; }
}

async function onPhoto(g, file) {
  if (!file) return;
  const card = document.getElementById("card-" + g.id);
  const res = card.querySelector(".res");
  res.style.display = "block";
  res.innerHTML = `<img class="thumb" id="thumb-${g.id}"><div class="muted" style="margin-top:8px">Uploading / reading...</div>`;
  document.getElementById("thumb-" + g.id).src = URL.createObjectURL(file);

  const small = await shrinkPhoto(file);
  const fd = new FormData();
  fd.append("gauge_id", g.id);
  fd.append("photo", small, "photo.jpg");
  let data;
  try {
    const r = await fetch("/gauge/api/read", { method: "POST", body: fd });
    data = await r.json();
  } catch (e) { data = { error: "Server connection failed" }; }

  if (data.error) {
    res.innerHTML += `<div class="warn">Read failed: ${esc(data.error)}<br>Please enter the value manually below.</div>` + manualHtml(g, "");
    return;
  }
  window["_last_" + g.id] = data;
  let html = "";
  if (data.value == null) {
    // Not calibrated — tap the two ticks around the needle (local interpolation = most accurate)
    html = `<div class="warn">Needle angle: ${data.angle_deg}° (not calibrated)</div>
      <div style="margin:12px 0">
        <button class="btn btn-ok" style="width:100%;padding:14px;font-size:16px" onclick="startTickMode('${g.id}')">📍 Tap ticks to calculate</button>
        <div style="margin-top:12px">
          <div style="font-weight:600;margin-bottom:8px">Or manual entry — unit?</div>
          <div class="row" style="margin-bottom:12px">
            <button class="btn" onclick="quickUnit('${g.id}','MPa')">MPa</button>
            <button class="btn" onclick="quickUnit('${g.id}','psi')">psi</button>
            <button class="btn" onclick="quickUnit('${g.id}','bar')">bar</button>
          </div>
          <div id="quick-val-${g.id}"></div>
        </div>
      </div>`;
  } else {
    html = `<div class="val">${data.value} <span style="font-size:18px">${esc(data.unit || "")}</span></div>
      <div class="muted-sm" style="font-size:12px">Needle angle ${data.angle_deg}° · auto read ✓ saved</div>
      <div class="row">
        <button class="btn btn-edit" onclick="showManual('${g.id}')">✏️ Correct value</button>
      </div>
      <div class="manual" style="display:none">${manualHtml(g, data.value)}</div>`;
    // Auto-save the reading immediately
    setTimeout(() => confirmReading(g.id, false), 100);
  }
  res.innerHTML = `<img class="thumb" src="${document.getElementById("thumb-" + g.id).src}">` + html;
}

function manualHtml(g, preset) {
  return `<input type="number" step="any" id="manual-${g.id}" placeholder="Enter value" value="${preset == null ? "" : preset}">
    <button class="btn btn-ok" onclick="confirmReading('${g.id}', true)">✓ Save</button>`;
}

// Quick unit selection: user picks unit, then enters value manually
function quickUnit(gid, unit) {
  event.target.closest('.row').querySelectorAll('.btn').forEach(b => b.style.opacity = '0.5');
  event.target.style.opacity = '1';
  event.target.style.borderColor = '#1976d2';
  const div = document.getElementById(`quick-val-${gid}`);
  div.innerHTML = `<div style="margin-top:8px">
      <input type="number" step="any" id="quick-input-${gid}" placeholder="Enter value (${unit})" style="width:150px;padding:10px;font-size:16px">
      <button class="btn btn-ok" onclick="quickSave('${gid}','${unit}')">✓ Save</button>
    </div>`;
  setTimeout(() => document.getElementById(`quick-input-${gid}`).focus(), 100);
}

function quickSave(gid, unit) {
  const inp = document.getElementById(`quick-input-${gid}`);
  const val = parseFloat(inp.value);
  if (isNaN(val)) {
    alert('Enter a value');
    return;
  }
  fetch('/gauge/api/log', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({gauge_id: gid, value: val, unit: unit})
  }).then(() => {
    const card = document.getElementById("card-" + gid);
    const res = card.querySelector(".res");
    res.innerHTML = `<div class="val">${val} <span style="font-size:18px">${unit}</span></div>
        <div class="muted-sm" style="font-size:12px">✓ saved</div>`;
  });
}

// Tick-based calculation (slider version): user enters the two tick values
// around the needle, then moves a 15-step slider to the needle position.
// Interpolates ONLY between the two surrounding ticks (local = most accurate).
let _tickState = {};
function startTickMode(gid) {
  const card = document.getElementById("card-" + gid);
  const res = card.querySelector(".res");
  const thumb = res.querySelector(".thumb");
  const imgUrl = thumb ? thumb.src : "";
  _tickState[gid] = {unit: null};
  res.innerHTML = `
    <img class="thumb" src="${imgUrl}" style="max-width:100%;border-radius:8px;margin-bottom:12px">
    <div style="font-weight:600;margin-bottom:8px">Needle is between which two big ticks?</div>
    <div style="display:flex;gap:10px;margin-bottom:6px">
      <div style="flex:1">Left tick value:<br>
        <input type="number" step="any" id="tick-v0-${gid}" placeholder="e.g. 0.5"
          style="width:100%;padding:12px;font-size:17px;box-sizing:border-box" oninput="tickSliderMove('${gid}')"></div>
      <div style="flex:1">Right tick value:<br>
        <input type="number" step="any" id="tick-v1-${gid}" placeholder="e.g. 1"
          style="width:100%;padding:12px;font-size:17px;box-sizing:border-box" oninput="tickSliderMove('${gid}')"></div>
    </div>
    <div style="margin:10px 0">
      <span style="font-weight:600">Unit:</span>
      <button class="btn tick-u" onclick="tickUnitSel('${gid}','MPa',event)">MPa</button>
      <button class="btn tick-u" onclick="tickUnitSel('${gid}','psi',event)">psi</button>
      <button class="btn tick-u" onclick="tickUnitSel('${gid}','bar',event)">bar</button>
    </div>
    <div style="margin:18px 0 6px">
      <div style="font-weight:600;margin-bottom:4px">Needle position (15 steps): <span id="tick-pos-${gid}" style="color:#1976d2">—</span></div>
      <input type="range" id="tick-slider-${gid}" min="0" max="15" step="1" value="7"
        style="width:100%;height:44px" oninput="tickSliderMove('${gid}')">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#666">
        <span>\u2190 left tick</span><span>right tick \u2192</span>
      </div>
    </div>
    <div id="tick-result-${gid}" style="font-size:26px;font-weight:700;margin:10px 0;min-height:36px"></div>
    <button class="btn btn-ok" style="width:100%;padding:14px;font-size:17px" onclick="calcTicksSlider('${gid}')">\u2713 Save reading</button>`;
}

function tickUnitSel(gid, unit, event) {
  _tickState[gid].unit = unit;
  const wrap = document.getElementById("card-" + gid);
  wrap.querySelectorAll(`.tick-u`).forEach(b => {
    b.style.opacity = b.textContent === unit ? '1' : '0.5';
  });
  tickSliderMove(gid);
}

function tickSliderMove(gid) {
  const v0 = parseFloat(document.getElementById(`tick-v0-${gid}`).value);
  const v1 = parseFloat(document.getElementById(`tick-v1-${gid}`).value);
  const pos = parseInt(document.getElementById(`tick-slider-${gid}`).value, 10);
  const st = _tickState[gid] || {};
  const unit = st.unit || '';
  document.getElementById(`tick-pos-${gid}`).textContent = pos + " / 15";
  const resDiv = document.getElementById(`tick-result-${gid}`);
  if (isNaN(v0) || isNaN(v1)) {
    resDiv.textContent = "";
    return;
  }
  const step = (v1 - v0) / 15;
  let value = v0 + step * pos;
  value = Math.round(value * 1000) / 1000;
  resDiv.innerHTML = `${value} <span style="font-size:17px;font-weight:400">${unit}</span>`;
}

function calcTicksSlider(gid) {
  const v0 = parseFloat(document.getElementById(`tick-v0-${gid}`).value);
  const v1 = parseFloat(document.getElementById(`tick-v1-${gid}`).value);
  if (isNaN(v0) || isNaN(v1)) { alert('Enter both tick values'); return; }
  const pos = parseInt(document.getElementById(`tick-slider-${gid}`).value, 10);
  const st = _tickState[gid] || {};
  const unit = st.unit || 'psi';
  const step = (v1 - v0) / 15;
  let value = v0 + step * pos;
  value = Math.round(value * 1000) / 1000;
  const g = (typeof gaugeMap !== 'undefined' && gaugeMap[gid]) ? gaugeMap[gid].g : {id: gid};
  fetch('/gauge/api/log', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({gauge_id: gid, value: value, unit: unit})
  }).then(() => {
    const card = document.getElementById("card-" + gid);
    const res = card.querySelector(".res");
    res.innerHTML = `<div class="val">${value} <span style="font-size:18px">${unit}</span></div>
        <div class="muted" style="font-size:12px">\u2713 saved</div>
        <div class="row" style="margin-top:8px">
          <button class="btn btn-edit" onclick="showManual('${gid}')">\u2710\uFE0F Correct value</button>
        </div>
        <div class="manual" style="display:none">${manualHtml(g, value)}</div>`;
  });
}

function showManual(gid) {
  const m = document.querySelector("#card-" + gid + " .manual");
  if (m) m.style.display = "block";
}

async function confirmReading(gid, manual) {
  const g = gauges.find(x => x.id === gid);
  const last = window["_last_" + gid] || {};
  let value = last.value;
  if (manual) {
    value = document.getElementById("manual-" + gid).value;
    if (value === "" || value == null) { toast("Please enter a value"); return; }
  }
  const body = {
    equip_id: EQUIP_ID, gauge_id: gid, value: value,
    unit: g.unit || last.unit || "",
    angle_deg: last.angle_deg || "", state: state === "run" ? "Running" : "Stopped",
    worker: worker.value || "", photo: last.photo || "", manual: manual
  };
  try {
    await fetch("/gauge/api/log", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  } catch (e) { toast("Save failed — please try again"); return; }
  doneSet.add(gid);
  localStorage.setItem("done_" + EQUIP_ID + "_" + state, JSON.stringify([...doneSet]));
  toast("Saved ✓");
  render();
}

btnRun.onclick = () => { state = "run"; doneSet = new Set(JSON.parse(localStorage.getItem("done_" + EQUIP_ID + "_" + state) || "[]")); render(); };
btnStop.onclick = () => { state = "stop"; doneSet = new Set(JSON.parse(localStorage.getItem("done_" + EQUIP_ID + "_" + state) || "[]")); render(); };

load();
</script>
</body>
</html>
