{% extends "coa/base.html" %}
{% block title %}{{ 'Edit Site' if site else 'New Site' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit Jobsite' if site else 'New Jobsite' }}</h1>
{% if error %}<div class="msg err">{{ error }}</div>{% endif %}
<form class="form" method="post">
  <label>Jobsite name <input name="name" required value="{{ site.name if site }}"></label>
  <label>Address <input name="address" value="{{ site.address if site }}"></label>
  <div class="grid2">
    <label>Latitude <input name="lat" type="number" step="any" value="{{ site.lat if site and site.lat is not none }}">
      <span class="muted small">For on-site arrival check (optional)</span></label>
    <label>Longitude <input name="lng" type="number" step="any" value="{{ site.lng if site and site.lng is not none }}"></label>
  </div>
  {% if site %}
  <label>Status
    <select name="status">
      <option value="active" {% if site.status=='active' %}selected{% endif %}>Active</option>
      <option value="inactive" {% if site.status=='inactive' %}selected{% endif %}>Inactive</option>
    </select>
  </label>
  {% endif %}
  <div class="row-actions">
    <button class="btn primary" type="submit">{{ 'Save' if site else 'Add Jobsite' }}</button>
    <a class="btn" href="{{ url_for('coa.sites') }}">Cancel</a>
  </div>
</form>
{% endblock %}
