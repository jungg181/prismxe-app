<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경일독 — 읽기</title>
<style>
  :root{
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --ink:#18181b; --ink-2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
    --bg:#f4f4f5; --card:#ffffff; --line:#e4e4e7; --line-soft:#f4f4f5;
    --input-bg:#ffffff; --hover-bg:#f4f4f5; --tile-bg:#f4f4f5;
    --brand:#16a34a; --brand-strong:#15803d; --brand-soft:#dcfce7;
    --brand-ring:rgba(22,163,74,.18);
    --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2;
    --radius:8px;
  }
  [data-theme="dark"]{
    --ink:#e8e8ea; --ink-2:#b0b0b5; --muted:#8a8a90; --faint:#5c5c62;
    --bg:#0a0a0b; --card:#131316; --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.06);
    --input-bg:#1a1a1d; --hover-bg:#1e1e21; --tile-bg:#1e1e21;
    --brand:#4ade80; --brand-strong:#86efac; --brand-soft:#0f1f14;
    --brand-ring:rgba(74,222,128,.28);
    --green:#4ade80; --green-bg:#0f1f14;
    --red:#f87171; --red-bg:#2a1214;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", serif; background: var(--bg); color: var(--ink); }
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--card); color: var(--ink); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .topbar a { color: var(--ink); text-decoration: none; font-size: 1.3rem; }
  .topbar h2 { font-size: 1.1rem; font-weight: 600; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 120px; }
  .verse { padding: 12px 10px; border-radius: 8px; line-height: 2; font-size: 1.15rem; margin-bottom: 4px; }
  .verse .vn { display: inline-block; min-width: 2em; font-size: .8em; color: var(--muted); font-weight: 600; vertical-align: top; margin-right: 6px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .verse.tts-active { background: var(--brand-soft); box-shadow: inset 4px 0 0 var(--brand); }
  .verse.voice-done { background: var(--green-bg); }
  .verse.voice-done .vn { color: var(--green); }
  .verse.voice-current { background: var(--brand-soft); box-shadow: inset 4px 0 0 var(--brand); }
  .controls { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); z-index: 20; }
  .controls .row { display: flex; gap: 8px; align-items: center; justify-content: center; max-width: 680px; margin: 0 auto; }
  .cbtn { flex: 1; padding: 12px 6px; border: 1px solid var(--line); border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; background: var(--tile-bg); color: var(--ink-2); }
  .cbtn.on { background: var(--brand); border-color: var(--brand); color: #0a0a0b; }
  .cbtn:disabled { opacity: .4; }
  .cbtn.mic-on { background: var(--red); border-color: var(--red); color: #fff; }
  .nav-row { display: flex; gap: 8px; margin: 16px 0; }
  .nav-row a { flex: 1; text-align: center; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: var(--brand); font-weight: 600; text-decoration: none; }
  .mark-row { margin: 8px 0 20px; }
  #markBtn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--brand); color: #0a0a0b; font-size: 1.05rem; font-weight: 600; cursor: pointer; }
  #markBtn.done { background: var(--green); color: #0a0a0b; }
  .speed { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
  .speed select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); font-size: .9rem; background: var(--input-bg); color: var(--ink); }
  .voice-bar { margin-top: 8px; }
  .voice-bar .track { height: 10px; background: var(--tile-bg); border-radius: 8px; overflow: hidden; }
  .voice-bar .fill { height: 100%; background: var(--brand); width: 0%; }
  .voice-bar .lbl { font-size: .82rem; color: var(--muted); margin-top: 4px; text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #voiceStatus { font-size: .85rem; color: var(--muted); text-align: center; margin-top: 8px; min-height: 1.2em; }
  .hidden { display: none !important; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 8px; }
  .panel h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
</style>
</head>
<body data-book="{{ book }}" data-chapter="{{ chapter }}">
<div class="topbar">
  <a href="/bible/">‹</a>
  <h2 id="chapTitle">불러오는 중...</h2>
  <a href="/bible/" style="font-size:1rem;">홈</a>
</div>

<div class="wrap">
  <div id="verses"></div>
  <div class="nav-row">
    <a id="prevLink" href="#">‹ 이전 장</a>
    <a id="nextLink" href="#">다음 장 ›</a>
  </div>
  <div class="mark-row">
    <button id="markBtn">이 장을 읽었어요</button>
  </div>
</div>

<div class="controls">
  <div class="row">
    <button class="cbtn" id="ttsBtn">읽어주기</button>
    <button class="cbtn" id="micBtn">따라읽기</button>
  </div>
  <div class="panel hidden" id="ttsPanel">
    <h3>읽어주기</h3>
    <div class="row">
      <button class="cbtn" id="ttsPlay">재생</button>
      <button class="cbtn" id="ttsStop">정지</button>
      <div class="speed">속도
        <select id="ttsRate">
          <option value="0.8">0.8x</option>
          <option value="1" selected>1x</option>
          <option value="1.2">1.2x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="speed">목소리
        <select id="ttsVoice" style="max-width:220px"></select>
      </div>
    </div>
    <div id="voiceHint" class="hidden" style="font-size:.82rem;color:#a08c5f;margin-top:6px;line-height:1.5"></div>
  </div>
  <div class="panel hidden" id="voicePanel">
    <h3>따라읽기 — 소리 내어 읽으면 색칠돼요</h3>
    <div class="row">
      <button class="cbtn" id="micToggle">시작</button>
    </div>
    <div class="voice-bar">
      <div class="track"><div class="fill" id="voiceFill"></div></div>
      <div class="lbl" id="voiceLabel">0 / 0 절</div>
    </div>
    <div id="voiceStatus"></div>
  </div>
</div>

{% raw %}<script>
const BOOK = parseInt(document.body.dataset.book), CHAPTER = parseInt(document.body.dataset.chapter);
let VERSES = [], BOOK_NAME = '', NAV = {};
let ME = null;

// ---------- load ----------
async function init() {
  const me = await fetch('/bible/api/me').then(r=>r.json());
  ME = me.user;
  const d = await fetch(`/bible/api/chapter/${BOOK}/${CHAPTER}`).then(r=>r.json());
  if (d.error) { document.getElementById('chapTitle').textContent = '없음'; return; }
  VERSES = d.verses; BOOK_NAME = d.book_name; NAV = d;
  document.getElementById('chapTitle').textContent = `${BOOK_NAME} ${CHAPTER}장`;
  document.title = `성경일독 — ${BOOK_NAME} ${CHAPTER}장`;
  const box = document.getElementById('verses');
  box.innerHTML = '';
  VERSES.forEach(v => {
    const div = document.createElement('div');
    div.className = 'verse'; div.id = 'v' + v.n;
    div.innerHTML = `<span class="vn">${v.n}</span><span class="vt">${v.t}</span>`;
    box.appendChild(div);
  });
  const pl = document.getElementById('prevLink'), nl = document.getElementById('nextLink');
  if (d.prev) { pl.href = `/bible/read/${d.prev.book}/${d.prev.chapter}`; } else { pl.style.opacity=.4; pl.href='#'; }
  if (d.next) { nl.href = `/bible/read/${d.next.book}/${d.next.chapter}`; } else { nl.style.opacity=.4; nl.href='#'; }
  updateMarkBtn();
  // save last position
  if (ME) saveProgress({last:{book:BOOK, chapter:CHAPTER}});
}

async function saveProgress(body) {
  if (!ME) return;
  try { await fetch('/bible/api/progress', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); } catch(e){}
}

async function updateMarkBtn() {
  if (!ME) return;
  const p = await fetch('/bible/api/progress').then(r=>r.json());
  const read = (p.read||{})[String(BOOK)] || [];
  const btn = document.getElementById('markBtn');
  if (read.includes(CHAPTER)) { btn.textContent = '읽음 완료'; btn.classList.add('done'); }
}
document.getElementById('markBtn').onclick = async () => {
  if (!ME) { alert('이메일로 로그인하면 읽은 기록이 저장돼요.'); location.href='/bible/auth'; return; }
  await saveProgress({mark_read:{book:BOOK, chapter:CHAPTER}});
  const btn = document.getElementById('markBtn');
  btn.textContent = '읽음 완료'; btn.classList.add('done');
};

// ---------- panel toggles ----------
const ttsPanel = document.getElementById('ttsPanel');
const voicePanel = document.getElementById('voicePanel');
document.getElementById('ttsBtn').onclick = () => {
  stopVoice();
  ttsPanel.classList.toggle('hidden');
  voicePanel.classList.add('hidden');
  document.getElementById('ttsBtn').classList.toggle('on', !ttsPanel.classList.contains('hidden'));
  document.getElementById('micBtn').classList.remove('on');
};
document.getElementById('micBtn').onclick = () => {
  stopTTS();
  voicePanel.classList.toggle('hidden');
  ttsPanel.classList.add('hidden');
  document.getElementById('micBtn').classList.toggle('on', !voicePanel.classList.contains('hidden'));
  document.getElementById('ttsBtn').classList.remove('on');
};

// ---------- TTS ----------
let ttsIdx = 0, ttsPlaying = false;
const VOICE_KEY = 'bible_tts_voice';

function koVoices() {
  return speechSynthesis.getVoices().filter(v => v.lang === 'ko-KR' || (v.lang||'').toLowerCase().startsWith('ko'));
}

// 스마트 기본 목소리: Google 한국어(신경망) > Samsung 한국어 > Microsoft 자연스러운 한국어 > 아무 ko-KR > 기본값
function pickBestVoice() {
  const vs = koVoices();
  if (!vs.length) return null;
  const saved = localStorage.getItem(VOICE_KEY);
  if (saved) {
    const found = vs.find(v => v.name === saved);
    if (found) return found;
  }
  const byName = (re) => vs.find(v => re.test(v.name));
  return byName(/google/i)
      || byName(/samsung/i)
      || byName(/microsoft.*(sunhi|injoon|seoyeon|korean|한국)/i)
      || vs.find(v => v.lang === 'ko-KR')
      || vs[0];
}

function currentVoice() {
  const sel = document.getElementById('ttsVoice');
  const vs = speechSynthesis.getVoices();
  const named = sel && sel.value ? vs.find(v => v.name === sel.value) : null;
  return named || pickBestVoice();
}

function showVoiceHint(show) {
  const h = document.getElementById('voiceHint');
  if (!h) return;
  if (show) {
    h.classList.remove('hidden');
    h.textContent = '이 기기에는 기본 목소리만 있어요. 휴대폰에서 열면 더 자연스러운 한국어 목소리(Google 한국어 등)를 쓸 수 있어요.';
  } else {
    h.classList.add('hidden');
  }
}

function refreshVoiceList() {
  const sel = document.getElementById('ttsVoice');
  if (!sel) return;
  const vs = koVoices();
  const curVal = sel.value;
  sel.innerHTML = '';
  if (!vs.length) {
    const o = document.createElement('option');
    o.textContent = '한국어 목소리 없음'; o.value = '';
    sel.appendChild(o);
    sel.disabled = true;
    showVoiceHint(true);
    return;
  }
  sel.disabled = false;
  vs.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name;
    sel.appendChild(o);
  });
  const pick = vs.find(v => v.name === curVal) || pickBestVoice();
  if (pick) sel.value = pick.name;
  const hasNatural = vs.some(v => /google|samsung|microsoft/i.test(v.name));
  showVoiceHint(!hasNatural);
}

function speakVerse(i) {
  if (i >= VERSES.length) { stopTTS(); return; }
  ttsIdx = i;
  document.querySelectorAll('.verse').forEach(e=>e.classList.remove('tts-active'));
  const el = document.getElementById('v'+VERSES[i].n);
  if (el) { el.classList.add('tts-active'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
  const u = new SpeechSynthesisUtterance(VERSES[i].t);
  u.lang = 'ko-KR';
  const v = currentVoice(); if (v) u.voice = v;
  u.rate = parseFloat(document.getElementById('ttsRate').value);
  u.pitch = 1.0;
  u.onend = () => { if (ttsPlaying) speakVerse(i+1); };
  u.onerror = () => { if (ttsPlaying) speakVerse(i+1); };
  speechSynthesis.speak(u);
}
function startTTS() {
  if (!('speechSynthesis' in window)) { alert('이 브라우저는 읽어주기를 지원하지 않아요.'); return; }
  speechSynthesis.cancel();
  ttsPlaying = true;
  document.getElementById('ttsPlay').textContent = '일시정지';
  speakVerse(0);
}
function stopTTS() {
  ttsPlaying = false;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('ttsPlay').textContent = '재생';
  document.querySelectorAll('.verse').forEach(e=>e.classList.remove('tts-active'));
}
document.getElementById('ttsPlay').onclick = () => {
  if (ttsPlaying && speechSynthesis.speaking && !speechSynthesis.paused) {
    speechSynthesis.pause(); document.getElementById('ttsPlay').textContent = '계속';
  } else if (ttsPlaying && speechSynthesis.paused) {
    speechSynthesis.resume(); document.getElementById('ttsPlay').textContent = '일시정지';
  } else startTTS();
};
document.getElementById('ttsStop').onclick = stopTTS;
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = refreshVoiceList;
  refreshVoiceList();
  const vsel = document.getElementById('ttsVoice');
  if (vsel) vsel.onchange = (e) => {
    try { localStorage.setItem(VOICE_KEY, e.target.value); } catch(_){}
  };
}

// ---------- Voice follow-along ----------
let rec = null, recOn = false, spokenNorm = '', verseDone = [];
const norm = s => (s||'').replace(/[\s.,!?;:'"“”‘’()\[\]…·—-]/g,'').replace(/{{|}}/g,'');

function subseqCoverage(verseNorm, spoken) {
  // how much of verseNorm appears as subsequence in spoken (in order)
  let j = 0;
  for (let i=0;i<spoken.length && j<verseNorm.length;i++) {
    if (spoken[i] === verseNorm[j]) j++;
  }
  return verseNorm.length ? j/verseNorm.length : 0;
}

function updateVoiceHighlight() {
  let doneCount = 0;
  for (let i=0;i<VERSES.length;i++) {
    const el = document.getElementById('v'+VERSES[i].n);
    if (verseDone[i]) { doneCount++; continue; }
    const cov = subseqCoverage(norm(VERSES[i].t), spokenNorm);
    if (cov >= 0.55) {
      verseDone[i] = true; doneCount++;
      el.classList.remove('voice-current'); el.classList.add('voice-done');
    } else if (i === doneCount) {
      el.classList.add('voice-current');
    }
  }
  document.querySelectorAll('.verse').forEach((el,i)=>{
    if (!verseDone[i] && i !== doneCount) el.classList.remove('voice-current');
  });
  const pct = VERSES.length ? Math.round(doneCount/VERSES.length*100) : 0;
  document.getElementById('voiceFill').style.width = pct + '%';
  document.getElementById('voiceLabel').textContent = `${doneCount} / ${VERSES.length} 절 (${pct}%)`;
  if (doneCount === VERSES.length) {
    setStatus('다 읽었어요');
    document.getElementById('markBtn').click();
  }
}

function setStatus(t){ document.getElementById('voiceStatus').textContent = t; }

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않아요. 크롬(Chrome)에서 열어주세요.'); return; }
  rec = new SR();
  rec.lang = 'ko-KR';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  verseDone = new Array(VERSES.length).fill(false);
  spokenNorm = '';
  document.querySelectorAll('.verse').forEach(e=>e.classList.remove('voice-done','voice-current'));

  rec.onresult = (ev) => {
    let txt = '';
    for (let i=ev.resultIndex;i<ev.results.length;i++) txt += ev.results[i][0].transcript;
    spokenNorm = norm(spokenNorm + ' ' + txt);
    // cap buffer to keep matching fast (last ~4000 chars)
    if (spokenNorm.length > 4000) spokenNorm = spokenNorm.slice(-4000);
    updateVoiceHighlight();
  };
  rec.onerror = (ev) => {
    if (ev.error === 'not-allowed') setStatus('마이크 권한을 허용해 주세요.');
    else if (ev.error === 'no-speech') setStatus('목소리가 잘 안 들려요. 크게 읽어주세요.');
    else setStatus('인식 중 문제가 생겼어요. 다시 시작해 주세요.');
  };
  rec.onend = () => { if (recOn) { try { rec.start(); } catch(e){} } };
  try {
    rec.start();
    recOn = true;
    document.getElementById('micToggle').textContent = '중지';
    document.getElementById('micToggle').classList.add('mic-on');
    setStatus('듣고 있어요... 소리 내어 읽어보세요.');
  } catch(e) { setStatus('음성 인식을 시작할 수 없어요.'); }
}

function stopVoice() {
  recOn = false;
  if (rec) { try { rec.stop(); } catch(e){} rec = null; }
  const t = document.getElementById('micToggle');
  if (t) { t.textContent = '시작'; t.classList.remove('mic-on'); }
}
document.getElementById('micToggle').onclick = () => { recOn ? stopVoice() : startVoice(); };

init();
</script>{% endraw %}
</body>
</html>
