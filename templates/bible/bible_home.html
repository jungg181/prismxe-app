<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경일독</title>
<style>
  :root{
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --ink:#18181b; --ink-2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
    --bg:#f4f4f5; --card:#ffffff; --line:#e4e4e7; --line-soft:#f4f4f5;
    --input-bg:#ffffff; --hover-bg:#f4f4f5; --thead-bg:#fafafa; --tile-bg:#f4f4f5;
    --brand:#16a34a; --brand-strong:#15803d; --brand-soft:#dcfce7;
    --brand-ring:rgba(22,163,74,.18);
    --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2;
    --amber:#d97706; --amber-bg:#fef3c7;
    --radius:8px;
  }
  [data-theme="dark"]{
    --ink:#e8e8ea; --ink-2:#b0b0b5; --muted:#8a8a90; --faint:#5c5c62;
    --bg:#0a0a0b; --card:#131316; --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.06);
    --input-bg:#1a1a1d; --hover-bg:#1e1e21; --thead-bg:#131316; --tile-bg:#1e1e21;
    --brand:#4ade80; --brand-strong:#86efac; --brand-soft:#0f1f14;
    --brand-ring:rgba(74,222,128,.28);
    --green:#4ade80; --green-bg:#0f1f14;
    --red:#f87171; --red-bg:#2a1214;
    --amber:#fbbf24; --amber-bg:#2a2210;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; padding: 28px 0 16px; }
  header h1 { font-size: 2rem; letter-spacing: 2px; font-weight: 600; }
  header p { color: var(--muted); margin-top: 8px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin: 12px 0; }
  .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
  .btn-primary { background: var(--brand); color: #0a0a0b; }
  .btn-primary:hover { background: var(--brand-strong); }
  .btn-ghost { background: var(--tile-bg); color: var(--ink-2); margin-top: 8px; border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--hover-bg); }
  .progress-ring { text-align: center; padding: 8px 0; }
  .progress-ring .pct { font-family: var(--mono); font-size: 2.6rem; font-weight: 600; color: var(--brand); font-variant-numeric: tabular-nums; }
  .progress-ring .sub { color: var(--muted); margin-top: 4px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .bar { height: 12px; background: var(--tile-bg); border-radius: 8px; overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; background: var(--brand); border-radius: 8px; }
  .row { display: flex; gap: 8px; }
  .row .btn { margin-top: 0; }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; }
  .tbl { width: 100%; border-collapse: collapse; font-size: .85rem; table-layout: fixed; }
  .tbl th, .tbl td { padding: 12px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: middle; }
  .tbl th { background: var(--thead-bg); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl td.num, .tbl th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .tbl tbody tr { cursor: pointer; }
  .tbl tbody tr:hover { background: var(--hover-bg); }
  .tbl tbody tr.done { background: var(--green-bg); }
  .tbl tbody tr.partial { background: var(--amber-bg); }
  .tbl .n { font-weight: 600; }
  .tbl .c { color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .sec-title { font-size: 1.15rem; font-weight: 600; margin: 20px 0 4px; }
  .muted { color: var(--muted); font-size: .9rem; }
  #userBox { text-align: center; }
  .hidden { display: none !important; }
  .plan-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line-soft); }
  .plan-item:last-child { border-bottom: none; }
  .plan-item a { color: var(--brand); font-weight: 600; text-decoration: none; }
  .badge { display: inline-block; background: var(--brand); color: #0a0a0b; font-size: .72rem; padding: 4px 12px; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>성경일독</h1>
    <p>매일 읽고, 듣고, 따라 읽어요</p>
  </header>

  <div class="card" id="userBox">
    <div id="loggedOut">
      <p class="muted" style="margin-bottom:12px;">이메일로 등록하면 읽던 곳을<br>어디서든 이어서 볼 수 있어요.</p>
      <a class="btn btn-primary" href="/bible/auth">이메일로 시작하기</a>
    </div>
    <div id="loggedIn" class="hidden">
      <p><span class="badge">로그인 중</span></p>
      <p style="margin:8px 0 4px; font-size:1.15rem; font-weight:600;" id="userName"></p>
      <p class="muted" id="userEmail"></p>
      <div class="row" style="margin-top:12px;">
        <a class="btn btn-ghost" href="/bible/plan" style="text-decoration:none; text-align:center;">오늘의 계획</a>
        <button class="btn btn-ghost" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="progress-ring">
      <div class="pct" id="pct">0%</div>
      <div class="sub" id="pctSub">0 / 1189 장 읽음</div>
      <div class="bar"><div id="barFill" style="width:0%"></div></div>
    </div>
    <a class="btn btn-primary" id="continueBtn" href="/bible/read/1/1">이어 읽기</a>
    <div class="row">
      <a class="btn btn-ghost" href="/bible/plan" style="text-decoration:none; text-align:center;">1년 계획</a>
      <a class="btn btn-ghost" href="/bible/read/1/1" style="text-decoration:none; text-align:center;">창세기부터</a>
    </div>
  </div>

  <div class="sec-title">오늘의 읽기 <span class="muted" id="planDay"></span></div>
  <div class="card" id="todayPlan"><p class="muted">불러오는 중...</p></div>

  <div class="sec-title">성경 66권</div>
  <div class="table-wrap">
    <table class="tbl">
      <colgroup><col><col style="width:120px"></colgroup>
      <thead><tr><th>책</th><th class="num">읽음</th></tr></thead>
      <tbody id="bookGrid"></tbody>
    </table>
  </div>

  <p class="muted" style="text-align:center; margin-top:24px; font-size:.8rem;">
    본문: Open Korean Bible (CC BY 4.0) · 개역한글 계열<br>
    <a href="/bible/data/backup" style="color:var(--muted);">데이터 백업</a>
  </p>
</div>

<script>
let BOOKS = [], PROGRESS = {read:{}, last:null}, ME = null;

async function init() {
  const [booksRes, meRes] = await Promise.all([
    fetch('/bible/api/books').then(r=>r.json()),
    fetch('/bible/api/me').then(r=>r.json())
  ]);
  BOOKS = booksRes;
  ME = meRes.user;
  if (ME) {
    document.getElementById('loggedOut').classList.add('hidden');
    document.getElementById('loggedIn').classList.remove('hidden');
    document.getElementById('userName').textContent = ME.name + '님';
    document.getElementById('userEmail').textContent = ME.email;
    const p = await fetch('/bible/api/progress').then(r=>r.json());
    PROGRESS = p;
    const last = ME.last || p.last;
    if (last) {
      const bn = BOOKS.find(b=>b.n===last.book);
      document.getElementById('continueBtn').href = `/bible/read/${last.book}/${last.chapter}`;
      document.getElementById('continueBtn').textContent = `이어 읽기 — ${bn?bn.name:''} ${last.chapter}장`;
    }
  }
  renderProgress();
  renderBooks();
  renderTodayPlan();
}

function readCount() {
  return Object.values(PROGRESS.read||{}).reduce((a,v)=>a+v.length,0);
}

function renderProgress() {
  const c = ME ? readCount() : 0;
  const pct = (c/1189*100);
  document.getElementById('pct').textContent = pct.toFixed(1) + '%';
  document.getElementById('pctSub').textContent = `${c} / 1189 장 읽음`;
  document.getElementById('barFill').style.width = pct + '%';
}

function renderBooks() {
  const g = document.getElementById('bookGrid');
  g.innerHTML = '';
  BOOKS.forEach(b => {
    const read = (PROGRESS.read||{})[String(b.n)] || [];
    const cls = read.length >= b.chapters ? 'done' : (read.length>0 ? 'partial' : '');
    const d = document.createElement('tr');
    d.className = cls;
    d.innerHTML = `<td class="n">${b.name}</td><td class="c num">${read.length}/${b.chapters}장</td>`;
    d.onclick = () => {
      // go to first unread chapter, or chapter 1
      let ch = 1;
      for (let i=1;i<=b.chapters;i++){ if(!read.includes(i)){ ch=i; break; } ch=i; }
      location.href = `/bible/read/${b.n}/${ch}`;
    };
    g.appendChild(d);
  });
}

async function renderTodayPlan() {
  const box = document.getElementById('todayPlan');
  try {
    const p = await fetch('/bible/api/plan/today').then(r=>r.json());
    document.getElementById('planDay').textContent = `Day ${p.day} / 365`;
    if (!p.items.length) { box.innerHTML = '<p class="muted">계획을 모두 마쳤어요</p>'; return; }
    box.innerHTML = p.items.map(it =>
      `<div class="plan-item"><a href="/bible/read/${it.book}/${it.chapter}">${it.book_name} ${it.chapter}장</a><span class="muted">읽기 →</span></div>`
    ).join('');
  } catch(e) { box.innerHTML = '<p class="muted">계획을 불러오지 못했어요.</p>'; }
}

document.getElementById('logoutBtn').onclick = async () => {
  await fetch('/bible/api/logout', {method:'POST'});
  location.reload();
};

init();
</script>
</body>
</html>
